name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (MariaDB 10.3, same as production)
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:10.3
        env:
          MARIADB_ROOT_PASSWORD: sheshape
          MARIADB_DATABASE: sheshape_test
          MARIADB_USER: sheshape
          MARIADB_PASSWORD: sheshape
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -psheshape --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  deploy-artifact:
    name: Assemble cPanel deploy folder
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: node scripts/build-deploy.mjs --skip-frontend-build
      - uses: actions/upload-artifact@v4
        with:
          name: sheshape-deploy
          path: deploy
          retention-days: 30
