document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

font-weight:700;font-size:34px;color:#fff;line-height:1.1\">Strong women,<br>stronger together<\u002Fdiv>\n              <div style=\"font-family:'Dancing Script',cursive;font-weight:700;font-size:30px;color:#57d97f;margin-top:12px\">learn · grow · thrive<\u002Fdiv>\n              <p style=\"font-size:15px;line-height:1.6;color:#cfe0d4;max-width:280px;margin:20px 0 0\">Fitness programs, nutrition and coaching designed for women in Rwanda.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"position:relative;z-index:2;width:100%;display:flex;flex-direction:column;gap:12px\">\n              <button sc-camel-on-click=\"{{ goSignup }}\" style=\"width:100%;background:#f6f6f3;color:#06311a;border:none;border-radius:16px;padding:17px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;cursor:pointer\">Get started<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ goHome }}\" style=\"width:100%;background:transparent;color:#cfe0d4;border:1.5px solid rgba(255,255,255,.3);border-radius:16px;padding:16px;font-family:'Montserrat',sans-serif;font-weight:600;font-size:15px;cursor:pointer\">I already have an account<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- SIGNUP -->\n        <sc-if value=\"{{ isSignup }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:100%;background:#f6f6f3;padding:26px 26px 40px\">\n            <button sc-camel-on-click=\"{{ goWelcome }}\" style=\"background:none;border:none;color:#06311a;font-size:22px;cursor:pointer;padding:0;margin-bottom:14px\">‹<\u002Fbutton>\n            <div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:30px;color:#06311a;line-height:1.1\">Create your<br>account<\u002Fdiv>\n            <div style=\"font-size:14px;color:#5b6b60;margin:8px 0 26px\">Step 1 of 2 · Let's get you set up.<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:16px\">\n              <div>\n                <div style=\"font-size:12px;font-weight:600;letter-spacing:.5px;color:#3a4740;margin-bottom:7px;text-transform:uppercase\">Full name<\u002Fdiv>\n                <input value=\"{{ fName }}\" sc-camel-on-input=\"{{ onName }}\" placeholder=\"e.g. Uwase Marie\" style=\"width:100%;border:1.5px solid #d6dcd2;background:#fff;border-radius:13px;padding:15px;font-family:'Montserrat',sans-serif;font-size:15px;color:#27332b;outline:none\">\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:12px;font-weight:600;letter-spacing:.5px;color:#3a4740;margin-bottom:7px;text-transform:uppercase\">Email<\u002Fdiv>\n                <input value=\"{{ fEmail }}\" sc-camel-on-input=\"{{ onEmail }}\" placeholder=\"you@email.com\" style=\"width:100%;border:1.5px solid #d6dcd2;background:#fff;border-radius:13px;padding:15px;font-family:'Montserrat',sans-serif;font-size:15px;color:#27332b;outline:none\">\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:12px;font-weight:600;letter-spacing:.5px;color:#3a4740;margin-bottom:7px;text-transform:uppercase\">Password<\u002Fdiv>\n                <input type=\"password\" value=\"{{ fPass }}\" sc-camel-on-input=\"{{ onPass }}\" placeholder=\"••••••••\" style=\"width:100%;border:1.5px solid #d6dcd2;background:#fff;border-radius:13px;padding:15px;font-family:'Montserrat',sans-serif;font-size:15px;color:#27332b;outline:none\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ goDetails }}\" style=\"width:100%;background:#06311a;color:#fff;border:none;border-radius:16px;padding:17px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;cursor:pointer;margin-top:26px\">Continue<\u002Fbutton>\n            <div style=\"text-align:center;font-size:13px;color:#8a978d;margin-top:18px\">By continuing you agree to our terms.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- DETAILS -->\n        <sc-if value=\"{{ isDetails }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:100%;background:#f6f6f3;padding:26px 26px 40px\">\n            <button sc-camel-on-click=\"{{ goSignup }}\" style=\"background:none;border:none;color:#06311a;font-size:22px;cursor:pointer;padding:0;margin-bottom:14px\">‹<\u002Fbutton>\n            <div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:30px;color:#06311a;line-height:1.1\">A bit about<br>you<\u002Fdiv>\n            <div style=\"font-size:14px;color:#5b6b60;margin:8px 0 24px\">Step 2 of 2 · So we can tailor your plan.<\u002Fdiv>\n\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.5px;color:#3a4740;margin-bottom:10px;text-transform:uppercase\">Your main goal<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px\">\n              <sc-for list=\"{{ goals }}\" as=\"g\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ g.onPick }}\" style=\"{{ g.style }}\">{{ g.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;gap:12px;margin-bottom:22px\">\n              <div style=\"flex:1\">\n                <div style=\"font-size:12px;font-weight:600;letter-spacing:.5px;color:#3a4740;margin-bottom:7px;text-transform:uppercase\">Age<\u002Fdiv>\n                <input value=\"{{ fAge }}\" sc-camel-on-input=\"{{ onAge }}\" placeholder=\"28\" style=\"width:100%;border:1.5px solid #d6dcd2;background:#fff;border-radius:13px;padding:14px;font-family:'Montserrat',sans-serif;font-size:15px;outline:none\">\n              <\u002Fdiv>\n              <div style=\"flex:1\">\n                <div style=\"font-size:12px;font-weight:600;letter-spacing:.5px;color:#3a4740;margin-bottom:7px;text-transform:uppercase\">Weight (kg)<\u002Fdiv>\n                <input value=\"{{ fWeight }}\" sc-camel-on-input=\"{{ onWeight }}\" placeholder=\"64\" style=\"width:100%;border:1.5px solid #d6dcd2;background:#fff;border-radius:13px;padding:14px;font-family:'Montserrat',sans-serif;font-size:15px;outline:none\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.5px;color:#3a4740;margin-bottom:10px;text-transform:uppercase\">Experience level<\u002Fdiv>\n            <div style=\"display:flex;gap:9px;margin-bottom:26px\">\n              <sc-for list=\"{{ levels }}\" as=\"l\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ l.onPick }}\" style=\"{{ l.style }}\">{{ l.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <button sc-camel-on-click=\"{{ goHome }}\" style=\"width:100%;background:#06311a;color:#fff;border:none;border-radius:16px;padding:17px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;cursor:pointer\">Finish &amp; explore<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- HOME -->\n        <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#f6f6f3;padding-bottom:26px\">\n            <div style=\"background:linear-gradient(160deg,#06311a,#04250f);padding:22px 24px 30px;border-bottom-left-radius:28px;border-bottom-right-radius:28px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:flex-start\">\n                <div>\n                  <div style=\"font-size:14px;color:#9ec6a6;font-weight:500\">{{ greeting }},<\u002Fdiv>\n                  <div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:26px;color:#fff\">{{ firstName }} 👋<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"width:44px;height:44px;border-radius:50%;background:#2f6b3d;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Playfair Display',serif;font-weight:700;font-size:18px\">{{ initial }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:10px;margin-top:20px\">\n                <div style=\"flex:1;background:rgba(255,255,255,.1);border-radius:16px;padding:13px 14px\"><div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:24px;color:#fff\">{{ sessionsDone }}<\u002Fdiv><div style=\"font-size:11px;color:#cfe0d4\">sessions done<\u002Fdiv><\u002Fdiv>\n                <div style=\"flex:1;background:rgba(255,255,255,.1);border-radius:16px;padding:13px 14px\"><div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:24px;color:#fff\">{{ streak }}<\u002Fdiv><div style=\"font-size:11px;color:#cfe0d4\">day streak<\u002Fdiv><\u002Fdiv>\n                <div style=\"flex:1;background:rgba(255,255,255,.1);border-radius:16px;padding:13px 14px\"><div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:24px;color:#fff\">{{ enrolledCount }}<\u002Fdiv><div style=\"font-size:11px;color:#cfe0d4\">programs<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:22px 24px 0\">\n              <div style=\"font-size:12px;font-weight:700;letter-spacing:1px;color:#2f6b3d;text-transform:uppercase;margin-bottom:12px\">Today's session<\u002Fdiv>\n              <div style=\"background:#06311a;border-radius:22px;overflow:hidden\">\n                <div style=\"height:132px;position:relative\"><image-slot id=\"home_today\" shape=\"rect\" placeholder=\"Session photo\"><\u002Fimage-slot><div style=\"position:absolute;inset:0;background:linear-gradient(to top,rgba(4,37,15,.85),rgba(4,37,15,.1))\"><\u002Fdiv>\n                  <div style=\"position:absolute;bottom:12px;left:16px;right:16px\"><div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:19px;color:#fff\">{{ todayTitle }}<\u002Fdiv><div style=\"font-size:12px;color:#cfe0d4\">{{ todayMeta }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:14px 16px;display:flex;align-items:center;justify-content:space-between\">\n                  <div style=\"font-size:13px;color:#cfe0d4\">{{ todayCoach }}<\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ startFromHome }}\" style=\"background:#9ec6a6;color:#06311a;border:none;border-radius:12px;padding:10px 18px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;cursor:pointer\">▶ Start<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:24px 24px 0\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px\">\n                <div style=\"font-size:12px;font-weight:700;letter-spacing:1px;color:#2f6b3d;text-transform:uppercase\">Your programs<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ goPrograms }}\" style=\"background:none;border:none;color:#06311a;font-weight:600;font-size:13px;cursor:pointer\">See all ›<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:11px\">\n                <sc-for list=\"{{ homePrograms }}\" as=\"p\" hint-placeholder-count=\"3\">\n                  <div sc-camel-on-click=\"{{ p.onSelect }}\" style=\"display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #e7e9e0;border-radius:18px;padding:12px;cursor:pointer\">\n                    <div style=\"{{ p.iconStyle }}\">{{ p.badge }}<\u002Fdiv>\n                    <div style=\"flex:1\"><div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:16px;color:#06311a\">{{ p.title }}<\u002Fdiv><div style=\"font-size:12px;color:#5b6b60\">{{ p.coach }}<\u002Fdiv><\u002Fdiv>\n                    <div style=\"{{ p.tagStyle }}\">{{ p.statusLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:24px 24px 0\">\n              <div style=\"background:#eaefe9;border:1.5px dashed #b9c7bb;border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center\">\n                <div style=\"flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:#06311a;display:flex;align-items:center;justify-content:center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\"><path d=\"M9 18h6M10 21h4\"><\u002Fpath><path d=\"M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.3 1 2.1v.4h6v-.4c0-.8.4-1.5 1-2.1A6 6 0 0 0 12 3z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                <div><div style=\"font-family:'Dancing Script',cursive;font-weight:700;font-size:22px;color:#2f6b3d;line-height:1\">Did you know?<\u002Fdiv><div style=\"font-size:13px;color:#27332b;line-height:1.4\">Lifting weights won't make you bulky — it builds lean strength.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- PROGRAMS LIST -->\n        <sc-if value=\"{{ isPrograms }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#f6f6f3;min-height:100%;padding:24px 24px 26px\">\n            <div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:28px;color:#06311a\">Programs<\u002Fdiv>\n            <div style=\"font-size:14px;color:#5b6b60;margin:6px 0 22px\">Structured plans led by our coaches.<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:16px\">\n              <sc-for list=\"{{ allPrograms }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-click=\"{{ p.onSelect }}\" style=\"background:#fff;border:1px solid #e7e9e0;border-radius:22px;overflow:hidden;cursor:pointer\">\n                  <div style=\"height:150px;position:relative\"><image-slot id=\"{{ p.slotId }}\" shape=\"rect\" placeholder=\"Program photo\"><\u002Fimage-slot><div style=\"position:absolute;inset:0;background:linear-gradient(to top,rgba(4,37,15,.8),rgba(4,37,15,0) 65%)\"><\u002Fdiv>\n                    <div style=\"{{ p.tagStyleAbs }}\">{{ p.statusLabel }}<\u002Fdiv>\n                    <div style=\"position:absolute;bottom:12px;left:16px;right:16px\"><div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:20px;color:#fff\">{{ p.title }}<\u002Fdiv><div style=\"font-size:12px;color:#cfe0d4\">{{ p.coach }} · {{ p.weeks }} weeks<\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"padding:14px 16px;font-size:13px;line-height:1.5;color:#3a4740\">{{ p.short }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- PROGRAM DETAIL -->\n        <sc-if value=\"{{ isDetail }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#f6f6f3;min-height:100%\">\n            <div style=\"height:230px;position:relative\">\n              <image-slot id=\"detail_hero\" shape=\"rect\" placeholder=\"Program hero photo\"><\u002Fimage-slot>\n              <div style=\"position:absolute;inset:0;background:linear-gradient(to top,rgba(4,37,15,.9),rgba(4,37,15,.15) 60%)\"><\u002Fdiv>\n              <button sc-camel-on-click=\"{{ goPrograms }}\" style=\"position:absolute;top:16px;left:16px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.35);border:none;color:#fff;font-size:20px;cursor:pointer\">‹<\u002Fbutton>\n              <div style=\"position:absolute;bottom:16px;left:22px;right:22px\">\n                <div style=\"{{ detailTagStyle }}\">{{ program.tag }}<\u002Fdiv>\n                <div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:27px;color:#fff;margin-top:8px\">{{ program.title }}<\u002Fdiv>\n                <div style=\"font-size:13px;color:#cfe0d4\">with {{ program.coach }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:22px 24px 30px\">\n              <div style=\"display:flex;gap:10px;margin-bottom:20px\">\n                <div style=\"flex:1;text-align:center;background:#eef0e9;border-radius:14px;padding:12px\"><div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:19px;color:#06311a\">{{ program.weeks }}<\u002Fdiv><div style=\"font-size:11px;color:#5b6b60\">weeks<\u002Fdiv><\u002Fdiv>\n                <div style=\"flex:1;text-align:center;background:#eef0e9;border-radius:14px;padding:12px\"><div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:19px;color:#06311a\">{{ program.sessions }}<\u002Fdiv><div style=\"font-size:11px;color:#5b6b60\">sessions<\u002Fdiv><\u002Fdiv>\n                <div style=\"flex:1;text-align:center;background:#eef0e9;border-radius:14px;padding:12px\"><div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:19px;color:#06311a\">{{ program.level }}<\u002Fdiv><div style=\"font-size:11px;color:#5b6b60\">level<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.6;color:#3a4740;margin-bottom:22px\">{{ program.desc }}<\u002Fdiv>\n              <div style=\"font-size:12px;font-weight:700;letter-spacing:1px;color:#2f6b3d;text-transform:uppercase;margin-bottom:12px\">What's included<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:26px\">\n                <sc-for list=\"{{ program.included }}\" as=\"it\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;align-items:center;gap:12px;font-size:14px;color:#27332b\"><span style=\"color:#2f6b3d;font-weight:800\">✓<\u002Fspan>{{ it }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ program.enrolled }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ startSession }}\" style=\"width:100%;background:#06311a;color:#fff;border:none;border-radius:16px;padding:17px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;cursor:pointer\">▶ Start today's session<\u002Fbutton>\n                <div style=\"text-align:center;font-size:13px;color:#2f6b3d;font-weight:600;margin-top:12px\">✓ You're enrolled<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ notEnrolled }}\" hint-placeholder-val=\"{{ true }}\">\n                <button sc-camel-on-click=\"{{ enroll }}\" style=\"width:100%;background:#06311a;color:#fff;border:none;border-radius:16px;padding:17px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;cursor:pointer\">Enroll in this program<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- WORKOUT PLAYER -->\n        <sc-if value=\"{{ isWorkout }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:100%;background:linear-gradient(165deg,#06311a,#04250f);padding:22px 24px 34px;display:flex;flex-direction:column\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center\">\n              <button sc-camel-on-click=\"{{ backToDetail }}\" style=\"background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0\">‹<\u002Fbutton>\n              <div style=\"font-size:13px;color:#9ec6a6;font-weight:600\">{{ program.title }}<\u002Fdiv>\n              <div style=\"width:22px\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:center;margin-top:14px\">\n              <div style=\"font-size:13px;color:#9ec6a6;font-weight:600;letter-spacing:1px\">EXERCISE {{ exerciseNo }} OF {{ exerciseTotal }}<\u002Fdiv>\n              <div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:28px;color:#fff;margin-top:4px\">{{ exerciseName }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:relative;width:230px;height:230px;margin:26px auto 0;display:flex;align-items:center;justify-content:center\">\n              <div style=\"position:absolute;inset:0;border-radius:50%;background:{{ ringStyle }}\"><\u002Fdiv>\n              <div style=\"position:absolute;inset:14px;border-radius:50%;background:#04250f;display:flex;flex-direction:column;align-items:center;justify-content:center\">\n                <div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:52px;color:#fff;letter-spacing:1px\">{{ timer }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#9ec6a6;letter-spacing:1px\">{{ timerState }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:center;gap:16px;margin-top:30px\">\n              <button sc-camel-on-click=\"{{ toggleTimer }}\" style=\"width:70px;height:70px;border-radius:50%;background:#9ec6a6;color:#06311a;border:none;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center\">{{ playIcon }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ nextExercise }}\" style=\"width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;border:none;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center\">»<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ finishWorkout }}\" style=\"width:100%;background:#f6f6f3;color:#06311a;border:none;border-radius:16px;padding:17px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;cursor:pointer;margin-top:24px\">✓ Mark session complete<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- COMPLETE -->\n        <sc-if value=\"{{ isComplete }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:100%;background:linear-gradient(165deg,#2f6b3d,#06311a);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 34px;text-align:center\">\n            <div style=\"width:104px;height:104px;border-radius:50%;bac         <!-- LOG HEALTH FORM -->\n        <sc-if value=\"{{ isLogHealth }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#f6f6f3;min-height:100%;padding:24px 24px 40px\">\n            <button sc-camel-on-click=\"{{ goHealth }}\" style=\"background:none;border:none;color:#06311a;font-size:22px;cursor:pointer;padding:0;margin-bottom:12px\">‹<\u002Fbutton>\n            <div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:28px;color:#06311a\">Log a reading<\u002Fdiv>\n            <div style=\"font-size:14px;color:#5b6b60;margin:6px 0 22px\">Enter today's measurements — leave blank to keep the last value.<\u002Fdiv>\n\n            <div style=\"font-size:12px;font-weight:700;letter-spacing:1px;color:#2f6b3d;text-transform:uppercase;margin-bottom:12px\">Body composition<\u002Fdiv>\n            <div style=\"display:flex;gap:11px;margin-bottom:12px\">\n              <div style=\"flex:1\"><div style=\"font-size:12px;color:#3a4740;margin-bottom:6px\">Weight (kg)<\u002Fdiv><input value=\"{{ hWeight }}\" sc-camel-on-input=\"{{ onHWeight }}\" placeholder=\"{{ phWeight }}\" style=\"width:100%;border:1.5px solid #d6dcd2;background:#fff;border-radius:12px;padding:13px;font-family:Montserrat,sans-serif;font-size:15px;outline:none\"><\u002Fdiv>\n              <div style=\"flex:1\"><div style=\"font-size:12px;color:#3a4740;margin-bottom:6px\">Body fat (%)<\u002Fdiv><input value=\"{{ hFat }}\" sc-camel-on-input=\"{{ onHFat }}\" placeholder=\"{{ phFat }}\" style=\"width:100%;border:1.5px solid #d6dcd2;background:#fff;border-radius:12px;padding:13px;font-family:Montserrat,sans-serif;font-size:15px;outline:none\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-bottom:22px\"><div style=\"font-size:12px;color:#3a4740;margin-bottom:6px\">Waist (cm)<\u002Fdiv><input value=\"{{ hWaist }}\" sc-camel-on-input=\"{{ onHWaist }}\" placeholder=\"{{ phWaist }}\" style=\"width:100%;border:1.5px solid #d6dcd2;background:#fff;border-radius:12px;padding:13px;font-family:Montserrat,sans-serif;font-size:15px;outline:none\"><\u002Fdiv>\n\n            <div style=\"font-size:12px;font-weight:700;letter-spacing:1px;color:#2f6b3d;text-transform:uppercase;margin-bottom:12px\">Health markers<\u002Fdiv>\n            <div style=\"display:flex;gap:11px;margin-bottom:12px\">\n              <div style=\"flex:1\"><div style=\"font-size:12px;color:#3a4740;margin-bottom:6px\">Blood sugar (mg/dL)<\u002Fdiv><input value=\"{{ hSugar }}\" sc-camel-on-input=\"{{ onHSugar }}\" placeholder=\"{{ phSugar }}\" style=\"width:100%;border:1.5px solid #d6dcd2;background:#fff;border-radius:12px;padding:13px;font-family:Montserrat,sans-serif;font-size:15px;outline:none\"><\u002Fdiv>\n              <div style=\"flex:1\"><div style=\"font-size:12px;color:#3a4740;margin-bottom:6px\">Cholesterol (mg/dL)<\u002Fdiv><input value=\"{{ hChol }}\" sc-camel-on-input=\"{{ onHChol }}\" placeholder=\"{{ phChol }}\" style=\"width:100%;border:1.5px solid #d6dcd2;background:#fff;border-radius:12px;padding:13px;font-family:Montserrat,sans-serif;font-size:15px;outline:none\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-bottom:26px\"><div style=\"font-size:12px;color:#3a4740;margin-bottom:6px\">Blood pressure (mmHg)<\u002Fdiv><input value=\"{{ hBp }}\" sc-camel-on-input=\"{{ onHBp }}\" placeholder=\"{{ phBp }}\" style=\"width:100%;border:1.5px solid #d6dcd2;background:#fff;border-radius:12px;padding:13px;font-family:Montserrat,sans-serif;font-size:15px;outline:none\"><\u002Fdiv>\n\n            <button sc-camel-on-click=\"{{ saveHealth }}\" style=\"width:100%;background:#06311a;color:#fff;border:none;border-radius:16px;padding:17px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;cursor:pointer\">Save reading<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- TRAINER PORTAL -->\n        <sc-if value=\"{{ isTrainer }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\ managed by She Shape Wellness -->\n            <div style=\"margin:20px 24px 0;background:#eaefe9;border:1.5px solid #d3ddd2;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center\">\n              <div style=\"flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:#06311a;display:flex;align-items:center;justify-content:center\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><path d=\"M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z\"><\u002Fpath><path d=\"M9.5 12l1.8 1.8L15 10\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <div style=\"font-size:12.5px;line-height:1.5;color:#27332b\"><b style=\"color:#06311a\">Managed by She Shape Wellness.<\u002Fb> Our admin team handles production, hosting &amp; payments — you focus on coaching.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- clients -->\n            <div style=\"padding:24px 24px 0\">\n              <div style=\"font-size:12px;font-weight:700;letter-spacing:1px;color:#2f6b3d;text-transform:uppercase;margin-bottom:12px\">Your clients<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:11px\">\n                <sc-for list=\"{{ clients }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <div style=\"background:#fff;border:1px solid #e7e9e0;border-radius:18px;padding:13px 15px\">\n                    <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:10px\">\n                      <div style=\"{{ c.avatarStyle }}\">{{ c.initial }}<\u002Fdiv>\n                      <div style=\"flex:1\"><div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:15px;color:#06311a\">{{ c.name }}<\u002Fdiv><div style=\"font-size:12px;color:#5b6b60\">{{ c.program }}<\u002Fdiv><\u002Fdiv>\n                      <div style=\"{{ c.tagStyle }}\">{{ c.status }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"height:8px;background:#eef0e9;border-radius:6px;overflow:hidden\"><div style=\"{{ c.fillStyle }}\"><\u002Fdiv><\u002Fdiv>\n                    <div style=\"display:flex;justify-content:space-between;margin-top:7px\"><span style=\"font-size:11px;color:#8a978d\">{{ c.detail }}<\u002Fspan><span style=\"font-size:11px;font-weight:700;color:#2f6b3d\">{{ c.pct }}%<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- programs -->\n            <div style=\"padding:24px 24px 0\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px\">\n                <div style=\"font-size:12px;font-weight:700;letter-spacing:1px;color:#2f6b3d;text-transform:uppercase\">Your programs<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ noop }}\" style=\"background:#06311a;color:#fff;border:none;border-radius:20px;padding:7px 14px;font-family:Montserrat,sans-serif;font-weight:700;font-size:12px;cursor:pointer\">+ New<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:11px\">\n                <sc-for list=\"{{ trainerPrograms }}\" as=\"p\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;align-items:center;gap:13px;background:#fff;border:1px solid #e7e9e0;border-radius:16px;padding:13px 15px\">\n                    <div style=\"{{ p.iconStyle }}\">{{ p.badge }}<\u002Fdiv>\n                    <div style=\"flex:1\"><div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:15px;color:#06311a\">{{ p.title }}<\u002Fdiv><div style=\"font-size:12px;color:#5b6b60\">{{ p.meta }}<\u002Fdiv><\u002Fdiv>\n                    <div style=\"{{ p.statusStyle }}\">{{ p.statusLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <!-- TAB BAR -->\n      <sc-if value=\"{{ showTab }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:0 0 auto;background:#fff;border-top:1px solid #e7e9e0;display:flex;padding:9px 8px 22px\">\n          <button sc-camel-on-click=\"{{ goHome }}\" style=\"{{ tabHomeStyle }}\"><svg width=\"23\" height=\"23\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linejoin=\"round\"><path d=\"M3 10.5 12 3l9 7.5\"><\u002Fpath><path d=\"M5 9.5V21h14V9.5\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10px;font-weight:600\">Home<\u002Fspan><\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goPrograms }}\" style=\"{{ tabProgStyle }}\"><svg width=\"23\" height=\"23\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2.5\"><\u002Frect><path d=\"M3 9h18M8 4v16\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10px;font-weight:600\">Programs<\u002Fspan><\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goNutrition }}\" style=\"{{ tabNutStyle }}\"><svg width=\"23\" height=\"23\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 3v7a3 3 0 0 0 6 0V3M9 3v18M18 3c-1.5 1-2 3-2 6s.5 4 2 4v8\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10px;font-weight:600\">Nutrition<\u002Fspan><\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goProgress }}\" style=\"{{ tabProgrStyle }}\"><svg width=\"23\" height=\"23\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10px;font-weight:600\">Progress<\u002Fspan><\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goHealth }}\" style=\"{{ tabHealthStyle }}\"><svg width=\"23\" height=\"23\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2 6 4-14 2 8h6\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10px;font-weight:600\">Health<\u002Fspan><\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goProfile }}\" style=\"{{ tabProfStyle }}\"><svg width=\"23\" height=\"23\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 21c0-4 3.5-6 8-6s8 2 8 6\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10px;font-weight:600\">Profile<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- HOME INDICATOR (iOS) -->\n      <sc-if value=\"{{ iosNotch }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;background:#000;border-radius:3px;opacity:.28;z-index:30;pointer-events:none\"><\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"{{ captionStyle }}\">Tap through: <b style=\"color:#06311a\">Get started → sign up → your details → Programs → enroll → Start session → Mark complete → Progress.<\u002Fb><\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.programs = [\n      { id:'strength', title:'Strength Training', coach:'Coach Arnoldine', tag:'STRENGTH', badge:'💪', weeks:8, sessions:24, level:'All', short:'Build lean, functional strength with progressive full-body training.',\n        desc:'A progressive 8-week plan that builds full-body strength, protects your bones and boosts metabolism — no bulk, just strong. Led by Coach Arnoldine.',\n        included:['24 guided strength sessio
